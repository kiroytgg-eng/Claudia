name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z" -d _unz; done || true
          FILE=$(find . -name ClaudeCompanionMod.java | head -n1)
          SRC="${FILE%/main/java/*}"
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r "$SRC" mdk/src
          cd mdk
          sed -i 's/^mod_id=.*/mod_id=claudecompanion/; s/^mod_name=.*/mod_name=Claude Companion/; s/^mod_group_id=.*/mod_group_id=com.claudecompanion/' gradle.properties
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeCompanion-jar
          path: mdk/build/libs/*.jar
